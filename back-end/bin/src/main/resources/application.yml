server:
  port: 8080

cors:
  originPatterns: ${FRONTEND_URL_1}

app:
  upload:
    dir: ${UPLOAD_DIR}
    base-path: ${UPLOAD_BASE_PATH}
    base-url: ${UPLOAD_BASE_URL}

spring:
  application:
    name: pitcherx
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${BD_SERVER}:${BD_PORT}/${BD_NAME}
    username: ${BD_USER}
    password: ${BD_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
    clean-disabled: false
    baseline-version: 0.1.0
    validate-on-migrate: false

spring-doc:
  enabled: true

logging:
  level:
    root: INFO
    org:
      springframework:
        web: INFO
      hibernate:
        SQL: INFO
        type:
          descriptor:
            sql: WARN



